<!DOCTYPE html>
<html lang="pt-mz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <div class="resultado">
            1
        </div>
        <div class="valores">
            <div class="linha">
                <button id="limpar" class="operacao">c</button>
                <button id="divisao" class="operacao">&divide;</button>
            </div>
            <div class="linha">
                <button id="nr1" class="numero" value="1">1</button>
                <button id="nr2" class="numero" value="2">2</button>
                <button id="nr3" class="numero" value="3">3</button>
                <button id="adicao" class="operacao">+</button>
            </div>
            <div class="linha">
                <button id="nr4" class="numero" value="4">4</button>
                <button id="nr5" class="numero" value="5">5</button>
                <button id="nr6" class="numero" value="6">6</button>
                <button id="subtracao" class="operacao">-</button>
            </div>
            <div class="linha">
                <button id="nr7" class="numero" value="7">7</button>
                <button id="nr8" class="numero" value="8">8</button>
                <button id="nr9" class="numero" value="9">9</button>
                <button id="multiplicacao" class="operacao">x</button>
            </div>
            <div class="linha">
                <button id="nr0" class="numero">0</button>
                <button id="igual" class="operacao">&equals;</button>
            </div>
        </div>
    </section>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
